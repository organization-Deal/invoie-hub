name = "deal-invoice-hub"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[vars]
APP_NAME = "DEAL Invoice Hub"
BASE_URL = "https://YOUR-WORKER.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "deal-invoice-hub"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["*/30 * * * *"]
